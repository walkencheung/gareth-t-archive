name: Unpack photo archives

on:
  push:
    paths:
      - 'assets/album/full.zip'
      - 'assets/album/thumb.zip'
      - 'assets/album/full-1.zip'
      - 'assets/album/full-2.zip'
      - 'assets/album/full-3.zip'
      - 'assets/album/full-4.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack archives
        run: |
          mkdir -p assets/album/full assets/album/thumb
          for f in assets/album/full.zip assets/album/full-1.zip assets/album/full-2.zip assets/album/full-3.zip assets/album/full-4.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f" -d assets/album/full
              rm "$f"
            fi
          done
          if [ -d assets/album/full/full ]; then
            mv assets/album/full/full/*.jpg assets/album/full/
            rmdir assets/album/full/full
          fi
          if [ -f assets/album/thumb.zip ]; then
            unzip -o assets/album/thumb.zip -d assets/album/thumb
            rm assets/album/thumb.zip
          fi
          if [ -d assets/album/thumb/thumb ]; then
            mv assets/album/thumb/thumb/*.jpg assets/album/thumb/
            rmdir assets/album/thumb/thumb
          fi
      - name: Commit extracted photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/album
          git diff --cached --quiet || git commit -m "Unpack photo wall images"
          git push
